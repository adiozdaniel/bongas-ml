# 🧬 BONGAS-ML: Sovereign Discovery CI/CD Pipeline

image: python:3.10-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "src"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python -m venv venv
  - source venv/bin/activate
  - pip install --upgrade pip
  - pip install -r requirements.txt

stages:
  - lint
  - test
  - build
  - package

# 🏛️ 1. LINT STAGE: Ensure "Vendor Safe Haven" Quality
lint:code:
  stage: lint
  script:
    - black --check src/ factory/ blackbox/
    - flake8 src/ factory/ blackbox/
    - mypy src/ factory/ blackbox/
  allow_failure: true

# 🧪 2. TEST STAGE: Verify the Proprietary Math Core
test:engine:
  stage: test
  script:
    - pytest tests/unit/ --cov=src/ml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# 🛡️ 3. BUILD STAGE: Obfuscate the Blackbox Trainer
build:blackbox:
  stage: build
  script:
    - python factory/builders/compile_trainer.py
  artifacts:
    paths:
      - ../bongas-ai/release/trainer/*.so
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# 📦 4. PACKAGE STAGE: Bundling Sovereign Artifacts
package:release:
  stage: package
  script:
    - echo "Packaging Sovereign Release..."
    - mkdir -p release_bundle/trainer
    - mkdir -p release_bundle/models/frozen
    # Collect the compiled obfuscated trainer
    - cp ../bongas-ai/release/trainer/*.so release_bundle/trainer/
    # Collect the exported base models (if present in dist)
    - cp -r dist/frozen/* release_bundle/models/frozen/ 2>/dev/null || true
    - tar -czvf bongas-ml-sovereign-release.tar.gz release_bundle/
  artifacts:
    paths:
      - bongas-ml-sovereign-release.tar.gz
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
