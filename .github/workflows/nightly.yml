name: Nightly Training

on:
  # schedule:
    # Run every day at 1:00 AM UTC
    # - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      customer_id:
        description: 'Specific customer ID (leave empty for all)'
        required: false
        type: string
      force_training:
        description: 'Force training even if no new data'
        required: false
        type: boolean
        default: false

concurrency:
  group: nightly-training
  cancel-in-progress: false

jobs:
  nightly-training:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-nightly-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-nightly-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Load secrets
        run: |
          echo "DB_URL=${{ secrets.BONGAS_SERVER_DB_URL }}" >> $GITHUB_ENV
          echo "REGISTRY_URL=${{ secrets.BONGAS_SERVER_REGISTRY_URL }}" >> $GITHUB_ENV
          echo "STORAGE_BUCKET=${{ secrets.BONGAS_STORAGE_BUCKET }}" >> $GITHUB_ENV

      - name: Validate environment
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Error: BONGAS_SERVER_DB_URL not set"
            exit 1
          fi
          if [ -z "$REGISTRY_URL" ]; then
            echo "Error: BONGAS_SERVER_REGISTRY_URL not set"
            exit 1
          fi

      - name: Run nightly training
        run: |
          if [ -n "${{ github.event.inputs.customer_id }}" ]; then
            echo "Training specific customer: ${{ github.event.inputs.customer_id }}"
            python scripts/nightly_job.py \
              --customer "${{ github.event.inputs.customer_id }}" \
              --db-url "$DB_URL" \
              --registry-url "$REGISTRY_URL" \
              --output-dir "outputs/nightly_$(date +%Y%m%d_%H%M%S)"
          else
            echo "Training all customers"
            python scripts/nightly_job.py \
              --all \
              --db-url "$DB_URL" \
              --registry-url "$REGISTRY_URL" \
              --output-dir "outputs/nightly_$(date +%Y%m%d_%H%M%S)"
          fi

      - name: Upload training outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-outputs-${{ github.run_number }}
          path: outputs/
          retention-days: 7

      - name: Send notification on failure
        if: failure()
        run: |
          echo "Nightly training failed. Check logs for details."
          # Could integrate with Slack, email, or other notification systems here

  health-check:
    runs-on: ubuntu-latest
    needs: nightly-training
    if: always()

    steps:
      - name: Check training status
        run: |
          if [ "${{ needs.nightly-training.result }}" == "failure" ]; then
            echo "❌ Nightly training failed"
            exit 1
          elif [ "${{ needs.nightly-training.result }}" == "success" ]; then
            echo "✅ Nightly training completed successfully"
          else
            echo "⚠️ Nightly training had issues"
          fi

  cleanup:
    runs-on: ubuntu-latest
    needs: [nightly-training, health-check]
    if: always()

    steps:
      - name: Clean up old artifacts
        run: |
          # This would typically be handled by GitHub's artifact retention policies
          echo "Cleaning up old training artifacts..."
